SPECIFICATION Spec
CONSTANTS
  p1 = p1
  q1 = q1
  d1 = d1
  d2 = d2
  e1 = e1
  e2 = e2
  Payments = {p1, q1}
  Deliveries = {d1, d2, e1, e2}
  Kind <- KindWebhookRetry
  Amount <- AmountWebhookRetry
  Payment <- PaymentWebhookRetry
  MatchingEnabled = TRUE
  RatioBps = 10000
  InitialPool = 0
CHECK_DEADLOCK FALSE
INVARIANTS
  TypeOK
  PaymentCreditedOnce
  RemainingNonNegative
  MatchedWithinPool
  PoolConservation
