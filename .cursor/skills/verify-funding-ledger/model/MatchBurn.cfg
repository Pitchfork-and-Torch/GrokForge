SPECIFICATION Spec
CONSTANTS
  p1 = p1
  p2 = p2
  d1 = d1
  d2 = d2
  Payments = {p1, p2}
  Deliveries = {d1, d2}
  Kind <- KindMatchBurn
  Amount <- AmountMatchBurn
  Payment <- PaymentMatchBurn
  MatchingEnabled = TRUE
  RatioBps = 10000
  InitialPool = 600
CHECK_DEADLOCK FALSE
INVARIANTS
  TypeOK
  PaymentCreditedOnce
  RemainingNonNegative
  MatchedWithinPool
  PoolConservation
